[package]
name = "quicknotes"
version = "0.14.0"
edition = "2021"
description = "A small tabbed notepad for text and code snippets"
license = "MIT"
repository = "https://github.com/Ravetracer/quicknotes"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
sourceview5 = { version = "0.9", features = ["v5_6"] }
webkit6 = "0.4"
gdk4-x11 = "0.9"
x11rb = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
quick-xml = "0.37"
docutils-core = "0.1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
sqlformat = "0.2"
base64 = "0.22"
urlencoding = "2"
dirs = "5"
tar = "0.4"
flate2 = "1"
unicode-width = "0.2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
getrandom = "0.2"
csv = "1.4"
calamine = "0.37"
encoding_rs = "0.8"
hayro = "0.8"
hayro-svg = "0.8"
jpeg-encoder = "0.7"
zip = { version = "9.5", default-features = false, features = ["deflate"] }
ureq = { version = "2.12", features = ["json"] }
libsecret = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Argon2 is far too slow without optimisation (tests, debug builds).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
